<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI任务分解系统 V6 (增强响应式版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
	<!-- 基础ICO -->
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
	<!-- 高清PNG -->
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-source-han-serif-sc-vf-regular/font.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --md-sys-elevation-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --md-sys-elevation-4: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            --md-sys-shape-corner-medium: 12px;
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-extra-large: 28px;
            --md-sys-shape-corner-full: 9999px;
            --md-sys-motion-duration-medium: 300ms;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', system-ui, sans-serif; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; touch-action: none; }

        /* Top Bar */
        .top-bar { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: relative; background: var(--md-sys-color-surface); z-index: 100; }
        .top-bar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--md-sys-color-primary), #625B71); }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo .material-icons-round { font-size: 28px; color: var(--md-sys-color-primary); }
        .logo h1 { font-size: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-bar-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full); border: 1px solid var(--md-sys-color-outline); background: var(--md-sys-color-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--md-sys-motion-duration-medium); flex-shrink: 0; }
        .icon-btn:hover { background: var(--md-sys-color-primary-container); border-color: var(--md-sys-color-primary); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* Guide */
        .usage-guide-card { 
            position: absolute; top: 24px; left: 24px; width: 300px; 
            background: var(--md-sys-color-surface); border-radius: var(--md-sys-shape-corner-large); 
            box-shadow: var(--md-sys-elevation-2); padding: 20px; z-index: 10; 
            animation: slideInLeft 0.4s; border: 1px solid var(--md-sys-color-outline-variant);
        }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        .usage-guide-card.hidden { display: none; }
        .guide-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .guide-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .guide-close { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .guide-close:hover { background: var(--md-sys-color-surface-variant); }
        .guide-content { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
        .guide-content p { margin-bottom: 4px; }

        .tree-container { width: 100%; height: 100%; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 40px; min-height: 500px; position: relative; cursor: grab; touch-action: none; }
        .tree-container:active { cursor: grabbing; }

        /* Config Panel */
        .config-panel { 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); 
            width: 90%; max-width: 600px; max-height: 80vh; 
            background: var(--md-sys-color-surface); border-radius: var(--md-sys-shape-corner-extra-large); 
            box-shadow: var(--md-sys-elevation-4); z-index: 1000; opacity: 0; pointer-events: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; 
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden; /* 确保内容不超出圆角 */
        }
        .config-panel.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .config-panel-header { 
            padding: 16px 24px; border-bottom: 1px solid var(--md-sys-color-outline-variant); 
            display: flex; justify-content: space-between; align-items: center;
            background: var(--md-sys-color-primary-container); 
            border-radius: 27px 27px 0 0; /* 保持顶部圆角 */
        }
        .config-panel-title { font-weight: 500; display: flex; align-items: center; gap: 8px; color: var(--md-sys-color-on-primary-container); }
        .config-panel-close { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .config-panel-close:hover { background: rgba(0,0,0,0.1); }
        .config-panel-body { padding: 24px; overflow-y: auto; flex: 1; }
        .form-section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--md-sys-color-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .md-textfield { width: 100%; padding: 14px 16px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-medium); font-family: inherit; font-size: 15px; background: var(--md-sys-color-surface); }
        .md-textfield:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; padding: 13px 15px; }
        .md-textarea { min-height: 120px; resize: vertical; }
        
        input[type="file"]::file-selector-button { border: none; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); padding: 8px 16px; border-radius: var(--md-sys-shape-corner-full); margin-right: 12px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        input[type="file"]::file-selector-button:hover { filter: brightness(0.95); }

        .color-picker-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .color-option { width: 100%; aspect-ratio: 1; border-radius: var(--md-sys-shape-corner-medium); cursor: pointer; border: 3px solid transparent; transition: 0.2s; position: relative; }
        .color-option:hover { transform: scale(1.05); }
        .color-option.active { border-color: var(--md-sys-color-on-surface); transform: scale(1.1); z-index: 1; }

        .button-group { display: flex; gap: 12px; margin-top: 24px; }
        .md-button { flex: 1; padding: 14px 24px; border: none; border-radius: var(--md-sys-shape-corner-full); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 15px; }
        .md-button-primary { background: var(--md-sys-color-primary); color: #fff; }
        .md-button-secondary { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }
        .md-button:hover { filter: brightness(0.9); box-shadow: var(--md-sys-elevation-2); }
        .md-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .config-toggle-btn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 20px; background: var(--md-sys-color-primary); color: #fff; border: none; box-shadow: var(--md-sys-elevation-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 999; }
        .config-toggle-btn:hover { transform: translateX(-50%) scale(1.05); box-shadow: var(--md-sys-elevation-4); }
        .config-toggle-btn .material-icons-round { font-size: 32px; }

        /* Tree Structure */
        .tree { display: flex; justify-content: center; align-items: flex-start; padding-bottom: 100px; transform-origin: top center; transition: transform 0.1s ease-out; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; margin: 0; list-style: none; }
        .tree li { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 20px 10px 0 10px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--md-sys-color-outline-variant); width: 50%; height: 20px; z-index: -1; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--md-sys-color-outline-variant); border-radius: 0 8px 0 0; }
        .tree li:first-child::after { border-radius: 8px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); width: 0; height: 20px; }

        .node-container { display: flex; align-items: flex-start; gap: 16px; position: relative; }
        .node-bubble { border: 2px solid var(--md-sys-color-primary); padding: 16px; border-radius: var(--md-sys-shape-corner-large); background: var(--md-sys-color-primary-container); min-width: 220px; max-width: 300px; text-align: left; box-shadow: var(--md-sys-elevation-1); transition: 0.2s; animation: bubbleScaleIn 0.3s; }
        @keyframes bubbleScaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .node-bubble:hover { transform: translateY(-4px); box-shadow: var(--md-sys-elevation-2); }
        .node-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .node-number { width: 32px; height: 32px; background: var(--md-sys-color-primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
        .node-title { font-weight: 600; font-size: 16px; color: var(--md-sys-color-on-primary-container); }
        .node-desc { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .node-action { text-align: right; display: flex; justify-content: flex-end; }
        .node-action button { padding: 8px 16px; font-size: 13px; border-radius: 99px; }

        .progress-container { display: flex; flex-direction: column; gap: 8px; }
        .progress-node { background: var(--md-sys-color-surface-variant); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-medium); min-width: 180px; max-width: 220px; text-align: left; position: relative; cursor: pointer; transition: 0.2s; overflow: hidden; }
        .progress-node::before { content: ''; position: absolute; left: -8px; top: 24px; transform: translateY(-50%); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid var(--md-sys-color-outline-variant); }
        .progress-node:hover { border-color: var(--md-sys-color-primary); transform: translateX(4px); }
        .progress-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-size: 12px; color: var(--md-sys-color-primary); font-weight: 600; background: rgba(103, 80, 164, 0.08); border-radius: 11px 11px 0 0; }
        .progress-preview { padding: 10px 12px; font-size: 11px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--md-sys-color-on-surface-variant); }

        .progress-detail-panel { 
            position: fixed; left: 50%; transform: translateX(-50%) translateY(100%); bottom: 0; 
            width: 90%; max-width: 900px; height: 80vh; 
            background: var(--md-sys-color-surface); border-radius: 28px 28px 0 0; 
            box-shadow: var(--md-sys-elevation-4); z-index: 2000; 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; flex-direction: column; border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden;
        }
        .progress-detail-panel.visible { transform: translateX(-50%) translateY(0); }
        .detail-panel-header { padding: 16px 24px; border-bottom: 1px solid var(--md-sys-color-outline-variant); display: flex; justify-content: space-between; align-items: center; background: var(--md-sys-color-primary-container); border-radius: 27px 27px 0 0; }
        .detail-panel-title { font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--md-sys-color-on-primary-container); }
        .detail-panel-close { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .detail-panel-close:hover { background: rgba(0,0,0,0.1); }
        .detail-panel-content { padding: 24px; overflow-y: auto; flex: 1; }

        .markdown-content { line-height: 1.8; color: var(--md-sys-color-on-surface); }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin-top: 1.5em; margin-bottom: 0.75em; font-weight: 600; color: var(--md-sys-color-primary); }
        .markdown-content h1 { font-size: 24px; border-bottom: 2px solid var(--md-sys-color-outline-variant); padding-bottom: 8px; }
        .markdown-content p { margin-bottom: 1em; }
        .markdown-content code { background: var(--md-sys-color-surface-variant); padding: 2px 6px; border-radius: 4px; font-family: 'Roboto Mono', monospace; font-size: 0.9em; }
        .markdown-content pre { background: var(--md-sys-color-on-surface); color: #fff; padding: 16px; border-radius: 12px; overflow-x: auto; margin-bottom: 1.5em; box-shadow: var(--md-sys-elevation-2); }
        .markdown-content pre code { background: none; color: inherit; padding: 0; }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); min-height: 400px; text-align: center; padding: 40px; }
        .empty-state .material-icons-round { font-size: 80px; margin-bottom: 24px; opacity: 0.2; color: var(--md-sys-color-primary); }
        .empty-state p { font-size: 18px; font-weight: 500; }

        .win-install-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--md-sys-color-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s ease-in-out; min-height: 500px; padding: 40px; }
        .win-install-screen.fade-out { opacity: 0; pointer-events: none; }
        .win-sentence-container { font-family: "Source Han Serif SC VF", serif; font-size: 24px; text-align: center; max-width: 800px; line-height: 1.8; opacity: 0; transition: opacity 1s ease-in-out; letter-spacing: 1px; color: var(--md-sys-color-on-surface); }
        .win-sentence-container.visible { opacity: 1; }
        .win-install-footer { position: absolute; bottom: 60px; font-size: 15px; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; gap: 12px; animation: pulseText 2s infinite ease-in-out; font-weight: 500; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 逆时针旋转动画 */
        @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        .spin-ccw { animation: spin-ccw 2s linear infinite; }

        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            .usage-guide-card { width: 260px; left: 16px; top: 16px; }
            .tree-container { padding: 20px; }
        }

        @media (max-width: 768px) {
            .top-bar { padding: 12px 16px; }
            .logo h1 { font-size: 18px; }
            
            .usage-guide-card { 
                position: relative; top: 0; left: 0; width: calc(100% - 32px); 
                margin: 16px auto 0; box-shadow: none; border: 1px solid var(--md-sys-color-outline-variant);
                animation: slideInDown 0.4s;
            }
            @keyframes slideInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
            
            .tree-container { padding: 10px; min-height: 400px; }
            .node-bubble { min-width: 200px; max-width: 240px; padding: 12px; }
            .node-title { font-size: 15px; }
            .node-desc { -webkit-line-clamp: 2; }
            
            .progress-node { min-width: 160px; max-width: 200px; }
            
            .config-panel { width: 100%; max-width: none; bottom: 0; border-radius: 28px 28px 0 0; height: 85vh; }
            .config-panel.visible { transform: translateX(-50%) translateY(0); }
            
            .progress-detail-panel { width: 100%; height: 90vh; border-radius: 28px 28px 0 0; }
            
            .color-picker-group { grid-template-columns: repeat(5, 1fr); gap: 8px; }
            
            .win-sentence-container { font-size: 20px; }
        }

        @media (max-width: 480px) {
            .logo h1 { max-width: 150px; }
            .top-bar-actions { gap: 4px; }
            .icon-btn { width: 36px; height: 36px; }
            .config-toggle-btn { width: 56px; height: 56px; bottom: 16px; }
            .node-container { flex-direction: column; gap: 8px; align-items: center; }
            .progress-node::before { display: none; }
            .progress-container { width: 100%; align-items: center; }
            .progress-node { width: 100%; max-width: 240px; }
            
            .tree li { padding: 20px 5px 0 5px; }
            .tree ul { padding-top: 15px; }
            
            .button-group { flex-direction: column; }
            .md-button { width: 100%; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo"><span class="material-icons-round">account_tree</span><h1>AI任务分解系统</h1></div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="exportBtn" title="导出为图片"><span class="material-icons-round">image</span></button>
            <button class="icon-btn" id="clearAllBtn" title="清空所有"><span class="material-icons-round">delete_sweep</span></button>
        </div>
    </header>

    <div class="main-content">
        <div class="usage-guide-card" id="usageGuide">
            <div class="guide-header">
                <div class="guide-title"><span class="material-icons-round" style="font-size: 18px;">info</span>使用说明</div>
                <button class="guide-close" id="guideCloseBtn" aria-label="关闭说明"><span class="material-icons-round">close</span></button>
            </div>
            <div class="guide-content">
                <p>1. 点击底部按钮打开任务配置</p>
                <p>2. 输入任务目标（支持上传文档/图片）</p>
                <p>3. 点击"开始分解"由后端全自动处理</p>
                <p>4. 点击节点进行深入提问</p>
            </div>
        </div>
        <div class="tree-container" id="treeContainer">
            <div class="tree" id="treeRoot">
                <div class="empty-state">
                    <span class="material-icons-round">account_tree</span>
                    <p>点击下方按钮配置任务并开始</p>
                </div>
            </div>
        </div>
    </div>

    <button class="config-toggle-btn" id="configToggleBtn" aria-label="打开配置"><span class="material-icons-round">settings</span></button>

    <div class="config-panel" id="configPanel">
        <div class="config-panel-header">
            <div class="config-panel-title"><span class="material-icons-round">tune</span>任务设定</div>
            <button class="config-panel-close" id="configCloseBtn" aria-label="关闭配置"><span class="material-icons-round">close</span></button>
        </div>
        <div class="config-panel-body">
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">assignment</span> 任务描述</div>
                <textarea id="taskInput" class="md-textfield md-textarea" placeholder="例如：我需要制定一个完整的营销方案..."></textarea>
            </div>
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">attach_file</span> 附件参考</div>
                <input type="file" id="fileUpload" class="md-textfield" accept=".txt,.md,image/png,image/jpeg,image/webp" multiple style="padding: 10px;">
                <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 8px; line-height: 1.4;">
                    *支持文本解析与图片直传（由 GLM-4.6V 多模态处理）。
                </div>
            </div>
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">palette</span> 主题颜色</div>
                <div class="color-picker-group" id="colorPicker">
                    <div class="color-option active" data-color="#6750A4" style="background: #6750A4;"></div>
                    <div class="color-option" data-color="#1976D2" style="background: #1976D2;"></div>
                    <div class="color-option" data-color="#388E3C" style="background: #388E3C;"></div>
                    <div class="color-option" data-color="#D32F2F" style="background: #D32F2F;"></div>
                    <div class="color-option" data-color="#F57C00" style="background: #F57C00;"></div>
                </div>
            </div>
            <div class="button-group">
                <button class="md-button md-button-secondary" id="clearTaskBtn"><span class="material-icons-round">delete</span> 重置</button>
                <button class="md-button md-button-primary" id="decomposeBtn"><span class="material-icons-round">play_arrow</span> 开始分解</button>
            </div>
        </div>
    </div>

    <div class="progress-detail-panel" id="detailPanel">
        <div class="detail-panel-header">
            <div class="detail-panel-title"><span class="material-icons-round">chat_bubble</span><span id="detailPanelTitle">详情</span></div>
            <button class="detail-panel-close" id="detailPanelClose" aria-label="关闭详情"><span class="material-icons-round">close</span></button>
        </div>
        <div class="detail-panel-content"><div class="markdown-content" id="detailPanelContent"></div></div>
    </div>

    <script>
        const API_BASE = 'https://api.hzyweb.xyz';
        const state = { mainNodes: [], progressNodes: {}, isProcessing: false, configPanelVisible: true, scale: 1 };
        const elements = {
            taskInput: document.getElementById('taskInput'), fileUpload: document.getElementById('fileUpload'),
            colorPicker: document.getElementById('colorPicker'), decomposeBtn: document.getElementById('decomposeBtn'),
            clearTaskBtn: document.getElementById('clearTaskBtn'), configPanel: document.getElementById('configPanel'),
            configToggleBtn: document.getElementById('configToggleBtn'), configCloseBtn: document.getElementById('configCloseBtn'),
            treeRoot: document.getElementById('treeRoot'), usageGuide: document.getElementById('usageGuide'),
            guideCloseBtn: document.getElementById('guideCloseBtn'), detailPanel: document.getElementById('detailPanel'),
            detailPanelTitle: document.getElementById('detailPanelTitle'), detailPanelContent: document.getElementById('detailPanelContent'),
            detailPanelClose: document.getElementById('detailPanelClose'), exportBtn: document.getElementById('exportBtn'),
            clearAllBtn: document.getElementById('clearAllBtn'), treeContainer: document.getElementById('treeContainer')
        };

        // 事件绑定
        elements.configToggleBtn.addEventListener('click', toggleConfigPanel);
        elements.configCloseBtn.addEventListener('click', toggleConfigPanel);
        elements.colorPicker.addEventListener('click', handleColorChange);
        elements.decomposeBtn.addEventListener('click', handleDecompose);
        elements.clearTaskBtn.addEventListener('click', () => { elements.taskInput.value = ''; elements.fileUpload.value = ''; });
        elements.guideCloseBtn.addEventListener('click', () => elements.usageGuide.classList.add('hidden'));
        elements.detailPanelClose.addEventListener('click', () => elements.detailPanel.classList.remove('visible'));
        elements.exportBtn.addEventListener('click', exportAsImage);
        elements.clearAllBtn.addEventListener('click', clearAll);

        // 拖拽与缩放逻辑
        let isDown = false;
        let startX, startY, scrollLeft, scrollTop;
        let initialDistance = 0;
        let initialScale = 1;

        elements.treeContainer.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - elements.treeContainer.offsetLeft;
            startY = e.pageY - elements.treeContainer.offsetTop;
            scrollLeft = elements.treeContainer.scrollLeft;
            scrollTop = elements.treeContainer.scrollTop;
        });
        elements.treeContainer.addEventListener('mouseleave', () => { isDown = false; });
        elements.treeContainer.addEventListener('mouseup', () => { isDown = false; });
        elements.treeContainer.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - elements.treeContainer.offsetLeft;
            const y = e.pageY - elements.treeContainer.offsetTop;
            const walkX = (x - startX) * 1.5;
            const walkY = (y - startY) * 1.5;
            elements.treeContainer.scrollLeft = scrollLeft - walkX;
            elements.treeContainer.scrollTop = scrollTop - walkY;
        });

        // 移动端双指缩放
        elements.treeContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initialScale = state.scale;
            } else if (e.touches.length === 1) {
                isDown = true;
                startX = e.touches[0].pageX - elements.treeContainer.offsetLeft;
                startY = e.touches[0].pageY - elements.treeContainer.offsetTop;
                scrollLeft = elements.treeContainer.scrollLeft;
                scrollTop = elements.treeContainer.scrollTop;
            }
        });

        elements.treeContainer.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const zoomFactor = currentDistance / initialDistance;
                state.scale = Math.min(Math.max(initialScale * zoomFactor, 0.3), 3);
                elements.treeRoot.style.transform = `scale(${state.scale})`;
            } else if (e.touches.length === 1 && isDown) {
                const x = e.touches[0].pageX - elements.treeContainer.offsetLeft;
                const y = e.touches[0].pageY - elements.treeContainer.offsetTop;
                const walkX = (x - startX) * 1.5;
                const walkY = (y - startY) * 1.5;
                elements.treeContainer.scrollLeft = scrollLeft - walkX;
                elements.treeContainer.scrollTop = scrollTop - walkY;
            }
        }, { passive: false });

        elements.treeContainer.addEventListener('touchend', () => { isDown = false; });

        function toggleConfigPanel() { 
            state.configPanelVisible = !state.configPanelVisible; 
            elements.configPanel.classList.toggle('visible', state.configPanelVisible); 
        }

        function handleColorChange(e) {
            const option = e.target.closest('.color-option'); if (!option) return;
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active')); option.classList.add('active');
            const color = option.dataset.color;
            document.documentElement.style.setProperty('--md-sys-color-primary', color);
            document.documentElement.style.setProperty('--md-sys-color-primary-container', color + '20');
        }

        let hitokotoInterval, hitokotoTimeout;
        function startWindowsLoading() {
            elements.treeRoot.innerHTML = `<div class="win-install-screen" id="winInstallScreen"><div class="win-sentence-container" id="winSentence">正在使用 GLM-4.6V 思考...</div><div class="win-install-footer"><span class="material-icons-round spin-ccw">sync</span><span>AI生成中...</span></div></div>`;
            const sentenceEl = document.getElementById('winSentence');
            setTimeout(() => { if (sentenceEl) sentenceEl.classList.add('visible'); }, 100);
            const fetchAndShow = async () => {
                if (!document.getElementById('winSentence')) return;
                sentenceEl.classList.remove('visible');
                hitokotoTimeout = setTimeout(async () => {
                    if (!document.getElementById('winSentence')) return;
                    try {
                        const res = await fetch('https://v1.hitokoto.cn/?c=i&encode=json');
                        sentenceEl.innerText = (await res.json()).hitokoto;
                    } catch (e) { sentenceEl.innerText = '保持热爱，奔赴山海。'; }
                    sentenceEl.classList.add('visible');
                }, 1000); 
            };
            hitokotoInterval = setInterval(fetchAndShow, 5000);
        }

        function stopWindowsLoading(cb) {
            clearInterval(hitokotoInterval); clearTimeout(hitokotoTimeout);
            const screen = document.getElementById('winInstallScreen');
            if (screen) { screen.classList.add('fade-out'); setTimeout(() => cb && cb(), 800); } else { cb && cb(); }
        }

        async function fetchSSE(url, bodyData, streamCallback) {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData) });
            if (!response.ok) throw new Error(`请求后端失败: ${response.status}`);
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '', buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let lines = buffer.split('\n');
                buffer = lines.pop();
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const content = JSON.parse(line.slice(6)).choices?.[0]?.delta?.content || "";
                            if (content) { fullText += content; if(streamCallback) streamCallback(fullText, false); }
                        } catch (e) {}
                    }
                }
            }
            if(streamCallback) streamCallback(fullText, true);
            return fullText;
        }

        async function extractFilesContent() {
            let textContent = "", imageList = []; 
            for (const file of elements.fileUpload.files) {
                if (file.type.startsWith('image/')) {
                    imageList.push(await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); }));
                } else if (file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                    textContent += `\n\n【附件参考：${file.name}】\n${await file.text()}\n`;
                }
            }
            return { textContent, imageList };
        }

        async function handleDecompose() {
            if (state.isProcessing) return;
            if (!elements.taskInput.value.trim()) return alert('请输入任务描述');
            
            if (state.configPanelVisible) toggleConfigPanel(); 
            state.isProcessing = true; elements.decomposeBtn.disabled = true;
            startWindowsLoading();

            try {
                const { textContent, imageList } = await extractFilesContent();
                const payload = { taskText: `请分解任务：\n${elements.taskInput.value.trim()}${textContent}`, images: imageList };

                await fetchSSE(`${API_BASE}/api/decompose`, payload, (streamText, isComplete) => {
                    if (isComplete) {
                        try {
                            const cleanJson = streamText.replace(/```json/gi, '').replace(/```/g, '').trim();
                            state.mainNodes = JSON.parse(cleanJson); state.progressNodes = {};
                            stopWindowsLoading(() => renderTree());
                        } catch (e) {
                            stopWindowsLoading(() => { alert(`解析失败。`); elements.treeRoot.innerHTML = `<div class="empty-state"><p>JSON解析失败</p></div>`; });
                        }
                    }
                });
            } catch (err) {
                stopWindowsLoading(() => { alert('处理出错：' + err.message); elements.treeRoot.innerHTML = `<div class="empty-state"><p>后端连接失败</p></div>`; });
            } finally { elements.decomposeBtn.disabled = false; state.isProcessing = false; }
        }

        function renderTree() {
            elements.treeRoot.innerHTML = '';
            if (!state.mainNodes.length) { elements.treeRoot.innerHTML = `<div class="empty-state"><span class="material-icons-round">account_tree</span><p>暂无数据</p></div>`; return; }

            const nodeMap = {}, roots = [];
            state.mainNodes.forEach(n => { n.children = []; nodeMap[n.id] = n; });
            state.mainNodes.forEach(n => { if (n.parentId && nodeMap[n.parentId]) nodeMap[n.parentId].children.push(n); else roots.push(n); });

            function buildHtml(node) {
                const pList = state.progressNodes[node.id] || [];
                let pHTML = pList.length ? `<div class="progress-container">${pList.map((p, i) => `<div class="progress-node" onclick="showDetail('${node.id}', ${i})"><div class="progress-header">进度 #${i+1}</div><div class="progress-preview" id="prev-${node.id}-${i}">${p.content.substring(0,50)}...</div></div>`).join('')}</div>` : '';
                
                let html = `<li><div class="node-container"><div class="node-bubble" id="node-${node.id}"><div class="node-header"><div class="node-number">${state.mainNodes.indexOf(node)+1}</div><div class="node-title">${node.title}</div></div><div class="node-desc">${node.desc}</div><div class="node-action"><button class="md-button md-button-primary" onclick="askNode('${node.id}')">提问</button></div></div>${pHTML}</div>`;
                if (node.children.length) html += `<ul>${node.children.map(buildHtml).join('')}</ul>`;
                return html + '</li>';
            }
            elements.treeRoot.innerHTML = `<ul>${roots.map(buildHtml).join('')}</ul>`;
            elements.treeRoot.style.transform = `scale(${state.scale})`;
        }

        async function askNode(nodeId) {
            const node = state.mainNodes.find(n => n.id == nodeId);
            const userQuestion = prompt(`关于步骤 [${node.title}] 您的疑问是？\n留空默认索要执行方案：`);
            if (userQuestion === null) return;

            const btn = document.querySelector(`#node-${nodeId} button`);
            const origTxt = btn.innerText; btn.disabled = true; btn.innerText = '...';

            try {
                if (!state.progressNodes[nodeId]) state.progressNodes[nodeId] = [];
                const pIdx = state.progressNodes[nodeId].length;
                state.progressNodes[nodeId].push({ content: '' }); renderTree();
                const prevEl = document.getElementById(`prev-${nodeId}-${pIdx}`);
                if (prevEl) prevEl.innerText = '生成中...';

                await fetchSSE(`${API_BASE}/api/ask`, { nodeId: node.id, title: node.title, desc: node.desc, userQuestion }, (streamText) => {
                    state.progressNodes[nodeId][pIdx].content = streamText;
                    if (prevEl) prevEl.innerText = streamText.substring(0,50) + '...';
                    if (elements.detailPanel.classList.contains('visible') && elements.detailPanelTitle.innerText.includes(`#${pIdx+1}`)) {
                        elements.detailPanelContent.innerHTML = marked.parse(streamText);
                    }
                });
            } catch (err) { alert('通信失败: ' + err.message); } 
            finally { btn.disabled = false; btn.innerText = origTxt; }
        }

        function showDetail(nid, idx) {
            elements.detailPanelTitle.innerText = `${state.mainNodes.find(n=>n.id==nid).title} - 进度 #${idx+1}`;
            elements.detailPanelContent.innerHTML = marked.parse(state.progressNodes[nid][idx].content);
            elements.detailPanel.classList.add('visible');
        }

        async function exportAsImage() {
            if (!state.mainNodes.length) return alert('暂无数据可导出');
            const btn = elements.exportBtn;
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons-round spin-ccw">sync</span>';

            try {
                // 临时重置缩放以获取清晰图片
                const currentScale = state.scale;
                elements.treeRoot.style.transform = 'scale(1)';
                
                const canvas = await html2canvas(elements.treeRoot, {
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-surface'),
                    scale: 2, // 提高清晰度
                    useCORS: true,
                    logging: false
                });
                
                // 恢复缩放
                elements.treeRoot.style.transform = `scale(${currentScale})`;

                const link = document.createElement('a');
                link.download = `AI_Task_Tree_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('导出图片失败: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        function clearAll() { if (confirm('确认清空？')) { state.mainNodes = []; state.progressNodes = {}; renderTree(); } }
    </script>
</body>
</html>
