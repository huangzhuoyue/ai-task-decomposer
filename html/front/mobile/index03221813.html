<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI任务分解系统 - 移动全功能版</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12);
            --md-sys-elevation-4: 0 14px 28px rgba(0,0,0,0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', sans-serif; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); overflow-x: hidden; }

        /* 顶部导航 */
        .top-bar { 
            height: 64px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; 
            background: var(--md-sys-color-surface); border-bottom: 1px solid var(--md-sys-color-outline-variant);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
        .logo .material-icons-round { color: var(--md-sys-color-primary); }
        .top-bar-actions { display: flex; gap: 8px; }

        /* 画布容器 */
        .tree-container { 
            width: 100vw; height: calc(100vh - 64px); overflow: auto; position: relative; 
            touch-action: none; background: #fafafa;
        }
        .tree { 
            display: inline-block; padding: 150px; transform-origin: 0 0; transition: transform 0.05s linear; 
        }

        /* 树状连线逻辑 (兼容所有浏览器) */
        .tree ul { display: flex; position: relative; padding-top: 20px; list-style: none; }
        .tree li { position: relative; padding: 20px 10px 0 10px; display: flex; flex-direction: column; align-items: center; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--md-sys-color-outline-variant); width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--md-sys-color-outline-variant); }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); width: 0; height: 20px; }

        /* 节点卡片 */
        .node-wrapper { display: flex; align-items: flex-start; gap: 12px; }
        .node-bubble { 
            background: var(--md-sys-color-primary-container); border: 2px solid var(--md-sys-color-primary);
            border-radius: 16px; padding: 12px; width: 220px; box-shadow: var(--md-sys-elevation-1);
        }
        .node-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .node-desc { 
            font-size: 12px; color: #444; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .node-desc.expanded { -webkit-line-clamp: unset; display: block; }
        .node-btn { 
            margin-top: 8px; width: 100%; padding: 6px; border: none; border-radius: 20px;
            background: var(--md-sys-color-primary); color: white; font-size: 11px; font-weight: 600;
        }

        /* 进度节点 */
        .progress-list { display: flex; flex-direction: column; gap: 6px; }
        .progress-card { 
            width: 140px; padding: 8px; background: white; border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 8px; font-size: 10px; cursor: pointer;
        }

        /* 弹窗与面板 */
        .panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: white; 
            border-radius: 24px 24px 0 0; box-shadow: var(--md-sys-elevation-4);
            transform: translateY(100%); transition: 0.3s ease; z-index: 1000; padding: 20px;
        }
        .panel.visible { transform: translateY(0); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

        /* 加载动画 */
        .loading-overlay { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.9); 
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 漂浮按钮 */
        .fab { 
            position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; 
            border-radius: 16px; background: var(--md-sys-color-primary); color: white;
            border: none; box-shadow: var(--md-sys-elevation-4); z-index: 99;
        }

        .markdown-body { font-size: 14px; line-height: 1.6; max-height: 60vh; overflow-y: auto; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo"><span class="material-icons-round">account_tree</span>AI 任务系统</div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="exportBtn" style="border:none; background:none;"><span class="material-icons-round">image</span></button>
            <button class="icon-btn" id="clearBtn" style="border:none; background:none;"><span class="material-icons-round">delete</span></button>
        </div>
    </header>

    <div class="tree-container" id="container">
        <div class="tree" id="treeRoot">
            <div style="padding: 100px; text-align: center; opacity: 0.3;">
                <span class="material-icons-round" style="font-size: 64px;">auto_awesome</span>
                <p>点击右下角开始分解任务</p>
            </div>
        </div>
    </div>

    <button class="fab" id="openConfig"><span class="material-icons-round">add</span></button>

    <!-- 配置面板 -->
    <div class="panel" id="configPanel">
        <div class="panel-header"><h3>新建任务</h3><button onclick="closePanels()" style="border:none;background:none"><span class="material-icons-round">close</span></button></div>
        <textarea id="taskInput" style="width:100%; height:100px; padding:12px; border-radius:12px; border:1px solid #ccc; margin-bottom:12px;" placeholder="描述你的任务..."></textarea>
        <div style="margin-bottom:12px;">
            <label style="font-size:12px; color:#666;">附件 (文本/图片)</label>
            <input type="file" id="fileInput" multiple style="font-size:12px; width:100%; margin-top:4px;">
        </div>
        <button id="runBtn" style="width:100%; padding:14px; border:none; border-radius:12px; background:var(--md-sys-color-primary); color:white; font-weight:700;">开始分解</button>
    </div>

    <!-- 详情面板 -->
    <div class="panel" id="detailPanel">
        <div class="panel-header"><h3 id="detailTitle">详情</h3><button onclick="closePanels()" style="border:none;background:none"><span class="material-icons-round">close</span></button></div>
        <div id="detailContent" class="markdown-body"></div>
    </div>

    <div class="loading-overlay" id="loader">
        <span class="material-icons-round spin" style="font-size:48px; color:var(--md-sys-color-primary);">sync</span>
        <p id="loadingText" style="margin-top:16px;">AI 正在思考...</p>
    </div>

    <script>
        const API_BASE = ''; // 解析为 m.mydomain.com 后，保持空字符串即可调用同域接口
        let state = { nodes: [], progress: {}, scale: 1 };

        // --- 缩放与平移核心 (指哪大哪) ---
        let initialDist = 0, isMoving = false, startX, startY, scrollL, scrollT;
        const container = document.getElementById('container');
        const treeRoot = document.getElementById('treeRoot');

        container.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else {
                isMoving = true;
                startX = e.touches[0].pageX - container.offsetLeft;
                startY = e.touches[0].pageY - container.offsetTop;
                scrollL = container.scrollLeft;
                scrollT = container.scrollTop;
            }
        });

        container.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const zoom = dist / initialDist;
                const newScale = Math.min(Math.max(state.scale * zoom, 0.3), 2);
                
                const midX = (e.touches[0].pageX + e.touches[1].pageX) / 2 - container.offsetLeft;
                const midY = (e.touches[0].pageY + e.touches[1].pageY) / 2 - container.offsetTop;

                const dx = (midX + container.scrollLeft) / state.scale;
                const dy = (midY + container.scrollTop) / state.scale;

                state.scale = newScale;
                treeRoot.style.transform = `scale(${state.scale})`;
                container.scrollLeft = dx * state.scale - midX;
                container.scrollTop = dy * state.scale - midY;
                initialDist = dist;
            } else if (isMoving) {
                const x = e.touches[0].pageX - container.offsetLeft;
                const y = e.touches[0].pageY - container.offsetTop;
                container.scrollLeft = scrollL - (x - startX);
                container.scrollTop = scrollT - (y - startY);
            }
        }, { passive: false });

        container.addEventListener('touchend', () => isMoving = false);

        // --- SSE & 任务逻辑 ---
        async function fetchSSE(url, body, onUpdate) {
            const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let result = '';
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const content = data.choices?.[0]?.delta?.content || "";
                            result += content;
                            onUpdate(result);
                        } catch(e){}
                    }
                }
            }
            return result;
        }

        document.getElementById('runBtn').onclick = async () => {
            const text = document.getElementById('taskInput').value;
            if(!text) return alert("请输入内容");
            closePanels();
            document.getElementById('loader').style.display = 'flex';

            // 处理附件 (Base64)
            const files = document.getElementById('fileInput').files;
            const images = [];
            for (let f of files) {
                if(f.type.startsWith('image/')) images.push(await new Promise(r => {const reader = new FileReader(); reader.onload=e=>r(e.target.result); reader.readAsDataURL(f);}));
            }

            try {
                const fullText = await fetchSSE(`${API_BASE}/api/decompose`, { taskText: text, images }, () => {});
                const cleanJson = fullText.replace(/```json/gi, '').replace(/```/g, '').trim();
                state.nodes = JSON.parse(cleanJson);
                renderTree();
            } catch(e) { alert("生成失败: " + e.message); }
            finally { document.getElementById('loader').style.display = 'none'; }
        };

        function renderTree() {
            const nodeMap = {};
            state.nodes.forEach(n => { n.children = []; nodeMap[n.id] = n; });
            const roots = [];
            state.nodes.forEach(n => {
                if (n.parentId && nodeMap[n.parentId]) nodeMap[n.parentId].children.push(n);
                else roots.push(n);
            });

            const buildHtml = (node) => {
                const pList = state.progress[node.id] || [];
                const pHTML = pList.length ? `<div class="progress-list">${pList.map((p,i) => `<div class="progress-card" onclick="showProgress('${node.id}', ${i})">进度 #${i+1}...</div>`).join('')}</div>` : '';
                
                let html = `<li><div class="node-wrapper"><div class="node-bubble" id="n-${node.id}">
                    <div class="node-title">${node.title}</div>
                    <div class="node-desc" onclick="this.classList.toggle('expanded')">${node.desc}</div>
                    <button class="node-btn" onclick="askNode('${node.id}')">提问/执行</button>
                </div>${pHTML}</div>`;
                if(node.children.length) html += `<ul>${node.children.map(buildHtml).join('')}</ul>`;
                return html + '</li>';
            };
            treeRoot.innerHTML = `<ul>${roots.map(buildHtml).join('')}</ul>`;
        }

        async function askNode(id) {
            const q = prompt("针对该步骤的疑问或要求：");
            if(q === null) return;
            const node = state.nodes.find(n => n.id == id);
            if(!state.progress[id]) state.progress[id] = [];
            const idx = state.progress[id].length;
            state.progress[id].push({ content: '生成中...' });
            renderTree();

            await fetchSSE(`${API_BASE}/api/ask`, { nodeId: id, userQuestion: q, title: node.title }, (txt) => {
                state.progress[id][idx].content = txt;
                if(document.getElementById('detailPanel').classList.contains('visible')) showProgress(id, idx);
            });
        }

        function showProgress(id, idx) {
            document.getElementById('detailTitle').innerText = `进度详情 #${idx+1}`;
            document.getElementById('detailContent').innerHTML = marked.parse(state.progress[id][idx].content);
            document.getElementById('detailPanel').classList.add('visible');
        }

        // --- 辅助功能 ---
        function closePanels() {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
        }
        document.getElementById('openConfig').onclick = () => document.getElementById('configPanel').classList.add('visible');
        document.getElementById('clearBtn').onclick = () => { if(confirm("确定清空吗？")) location.reload(); };
        document.getElementById('exportBtn').onclick = async () => {
            const canvas = await html2canvas(treeRoot, { scale: 2, backgroundColor: '#fafafa' });
            const link = document.createElement('a');
            link.download = `task-tree-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
