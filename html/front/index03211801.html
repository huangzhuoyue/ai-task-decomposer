<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI任务分解系统 V6 (分离架构版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --md-sys-elevation-4: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            --md-sys-shape-corner-medium: 12px;
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-extra-large: 28px;
            --md-sys-shape-corner-full: 9999px;
            --md-sys-motion-duration-medium: 300ms;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', system-ui, sans-serif; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* Top Bar */
        .top-bar { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .top-bar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--md-sys-color-primary), #625B71); }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo .material-icons-round { font-size: 28px; color: var(--md-sys-color-primary); }
        .logo h1 { font-size: 20px; font-weight: 500; }
        .top-bar-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full); border: 1px solid var(--md-sys-color-outline); background: var(--md-sys-color-surface); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--md-sys-motion-duration-medium); }
        .icon-btn:hover { background: var(--md-sys-color-primary-container); border-color: var(--md-sys-color-primary); }

        /* Main Content */
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
        
        /* Guide */
        .usage-guide-card { position: absolute; top: 24px; left: 24px; width: 300px; background: var(--md-sys-color-surface); border-radius: var(--md-sys-shape-corner-large); box-shadow: var(--md-sys-elevation-2); padding: 20px; z-index: 10; animation: slideInLeft 0.4s; }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        .usage-guide-card.hidden { opacity: 0; pointer-events: none; }
        .guide-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .guide-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .guide-close { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 50%; }
        .guide-content { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }

        .tree-container { width: 100%; height: 100%; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 60px; min-height: 600px; position: relative; }

        /* Config Panel */
        .config-panel { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); width: 90%; max-width: 600px; max-height: 70vh; background: var(--md-sys-color-surface); border-radius: var(--md-sys-shape-corner-extra-large); box-shadow: var(--md-sys-elevation-4); z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s; display: flex; flex-direction: column; }
        .config-panel.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .config-panel-header { padding: 16px 24px; border-bottom: 1px solid var(--md-sys-color-outline-variant); display: flex; justify-content: space-between; background: var(--md-sys-color-primary-container); }
        .config-panel-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .config-panel-close { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; }
        .config-panel-body { padding: 24px; overflow-y: auto; flex: 1; }
        .form-section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 500; color: var(--md-sys-color-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .md-textfield { width: 100%; padding: 14px 16px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-medium); font-family: inherit; font-size: 15px; }
        .md-textfield:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; padding: 13px 15px; }
        .md-textarea { min-height: 120px; resize: vertical; }
        
        input[type="file"]::file-selector-button { border: none; background: var(--md-sys-color-primary-container); padding: 8px 16px; border-radius: var(--md-sys-shape-corner-full); margin-right: 12px; cursor: pointer; transition: 0.2s; }
        input[type="file"]::file-selector-button:hover { filter: brightness(0.95); }

        .color-picker-group { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
        .color-option { width: 32px; height: 32px; border-radius: var(--md-sys-shape-corner-small); cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-option:hover, .color-option.active { transform: scale(1.15); border-color: var(--md-sys-color-on-surface); }

        .button-group { display: flex; gap: 12px; margin-top: 24px; }
        .md-button { flex: 1; padding: 12px 24px; border: none; border-radius: var(--md-sys-shape-corner-full); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .md-button-primary { background: var(--md-sys-color-primary); color: #fff; }
        .md-button-secondary { background: #625B71; color: #fff; }
        .md-button:hover { filter: brightness(0.9); box-shadow: var(--md-sys-elevation-2); }

        .config-toggle-btn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: var(--md-sys-shape-corner-extra-large); background: var(--md-sys-color-primary); color: #fff; border: none; box-shadow: var(--md-sys-elevation-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 999; }
        .config-toggle-btn:hover { transform: translateX(-50%) scale(1.05); }

        /* Tree Structure */
        .tree { display: flex; justify-content: center; align-items: flex-start; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; margin: 0; list-style: none; width: 100%; }
        .tree li { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 20px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--md-sys-color-outline-variant); width: 50%; height: 20px; z-index: -1; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--md-sys-color-outline-variant); border-radius: 0 8px 0 0; }
        .tree li:first-child::after { border-radius: 8px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--md-sys-color-outline-variant); width: 0; height: 20px; }

        .node-container { display: flex; align-items: flex-start; gap: 16px; position: relative; }
        .node-bubble { border: 2px solid var(--md-sys-color-primary); padding: 16px; border-radius: var(--md-sys-shape-corner-large); background: var(--md-sys-color-primary-container); min-width: 200px; max-width: 280px; text-align: left; box-shadow: var(--md-sys-elevation-1); transition: 0.2s; animation: bubbleScaleIn 0.3s; }
        @keyframes bubbleScaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .node-bubble:hover { transform: translateY(-2px); }
        .node-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .node-number { width: 36px; height: 36px; background: var(--md-sys-color-primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
        .node-title { font-weight: 500; font-size: 16px; }
        .node-desc { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 16px; }
        .node-action { text-align: right; display: flex; justify-content: flex-end; }
        .node-action button { padding: 6px 12px; font-size: 12px; border-radius: 99px; }

        .progress-container { display: flex; flex-direction: column; gap: 8px; }
        .progress-node { background: var(--md-sys-color-surface-variant); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-medium); min-width: 180px; max-width: 220px; text-align: left; position: relative; cursor: pointer; transition: 0.2s; }
        .progress-node::before { content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid var(--md-sys-color-outline-variant); }
        .progress-node:hover { border-color: var(--md-sys-color-primary); }
        .progress-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-size: 12px; color: var(--md-sys-color-primary); font-weight: 500; background: rgba(103, 80, 164, 0.05); border-radius: 12px 12px 0 0; }
        .progress-preview { padding: 10px 12px; font-size: 11px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .progress-detail-panel { position: fixed; left: 50%; transform: translateX(-50%) translateY(100%); bottom: 0; width: 80%; max-width: 900px; max-height: 70vh; background: var(--md-sys-color-surface); border-radius: 28px 28px 0 0; box-shadow: var(--md-sys-elevation-4); z-index: 3000; opacity: 0; pointer-events: none; transition: 0.4s; display: flex; flex-direction: column; }
        .progress-detail-panel.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .detail-panel-header { padding: 16px 24px; border-bottom: 1px solid var(--md-sys-color-outline-variant); display: flex; justify-content: space-between; align-items: center; background: var(--md-sys-color-primary-container); border-radius: 28px 28px 0 0; }
        .detail-panel-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .detail-panel-close { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; }
        .detail-panel-content { padding: 24px; overflow-y: auto; flex: 1; }

        .markdown-content { line-height: 1.8; }
        .markdown-content h1, .markdown-content h2 { margin-top: 1.5em; margin-bottom: 0.75em; font-weight: 600; }
        .markdown-content h1 { font-size: 24px; border-bottom: 2px solid var(--md-sys-color-outline-variant); padding-bottom: 8px; }
        .markdown-content code { background: var(--md-sys-color-surface-variant); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .markdown-content pre { background: var(--md-sys-color-surface-variant); padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant); min-height: 400px; text-align: center; }
        .empty-state .material-icons-round { font-size: 80px; margin-bottom: 16px; opacity: 0.3; }

        .win-install-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--md-sys-color-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s ease-in-out; min-height: 600px; }
        .win-install-screen.fade-out { opacity: 0; pointer-events: none; }
        .win-sentence-container { font-family: 'SimSun', '宋体', serif; font-size: 28px; text-align: center; max-width: 70%; line-height: 1.6; opacity: 0; transition: opacity 1s ease-in-out; letter-spacing: 2px; }
        .win-sentence-container.visible { opacity: 1; }
        .win-install-footer { position: absolute; bottom: 50px; font-family: 'SimSun', '宋体', serif; font-size: 16px; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; gap: 12px; animation: pulseText 2s infinite ease-in-out; }
        @keyframes pulseText { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 10px; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo"><span class="material-icons-round">account_tree</span><h1>AI任务分解系统</h1></div>
        <div class="top-bar-actions">
            <button class="icon-btn" id="exportBtn" title="导出数据"><span class="material-icons-round">download</span></button>
            <button class="icon-btn" id="clearAllBtn" title="清空所有"><span class="material-icons-round">delete_sweep</span></button>
        </div>
    </header>

    <div class="main-content">
        <div class="usage-guide-card" id="usageGuide">
            <div class="guide-header">
                <div class="guide-title"><span class="material-icons-round" style="font-size: 18px;">info</span>使用说明</div>
                <button class="guide-close" id="guideCloseBtn"><span class="material-icons-round">close</span></button>
            </div>
            <div class="guide-content">
                <p>1. 点击底部按钮打开任务配置</p>
                <p>2. 输入任务目标（支持上传文档/图片）</p>
                <p>3. 点击"开始分解"由后端全自动处理</p>
                <p>4. 点击节点进行深入提问</p>
            </div>
        </div>
        <div class="tree-container" id="treeContainer">
            <div class="tree" id="treeRoot">
                <div class="empty-state"><span class="material-icons-round">account_tree</span><p>点击下方按钮配置任务并开始</p></div>
            </div>
        </div>
    </div>

    <button class="config-toggle-btn" id="configToggleBtn"><span class="material-icons-round">settings</span></button>

    <div class="config-panel" id="configPanel">
        <div class="config-panel-header">
            <div class="config-panel-title"><span class="material-icons-round">tune</span>任务设定</div>
            <button class="config-panel-close" id="configCloseBtn"><span class="material-icons-round">close</span></button>
        </div>
        <div class="config-panel-body">
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">assignment</span> 任务描述</div>
                <textarea id="taskInput" class="md-textfield md-textarea" placeholder="例如：我需要制定一个完整的营销方案..."></textarea>
            </div>
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">attach_file</span> 附件参考</div>
                <input type="file" id="fileUpload" class="md-textfield" accept=".txt,.md,image/png,image/jpeg,image/webp" multiple style="padding: 10px;">
                <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 6px;">
                    *开箱即用支持：文本解析与图片直传（由 GLM-4.6V 多模态处理）。
                </div>
            </div>
            <div class="form-section">
                <div class="section-title"><span class="material-icons-round">palette</span> 主题颜色</div>
                <div class="color-picker-group" id="colorPicker">
                    <div class="color-option active" data-color="#6750A4" style="background: #6750A4;"></div>
                    <div class="color-option" data-color="#1976D2" style="background: #1976D2;"></div>
                    <div class="color-option" data-color="#388E3C" style="background: #388E3C;"></div>
                    <div class="color-option" data-color="#D32F2F" style="background: #D32F2F;"></div>
                    <div class="color-option" data-color="#F57C00" style="background: #F57C00;"></div>
                </div>
            </div>
            <div class="button-group">
                <button class="md-button md-button-secondary" id="clearTaskBtn"><span class="material-icons-round">delete</span> 重置</button>
                <button class="md-button md-button-primary" id="decomposeBtn"><span class="material-icons-round">play_arrow</span> 开始分解</button>
            </div>
        </div>
    </div>

    <div class="progress-detail-panel" id="detailPanel">
        <div class="detail-panel-header">
            <div class="detail-panel-title"><span class="material-icons-round">chat_bubble</span><span id="detailPanelTitle">详情</span></div>
            <button class="detail-panel-close" id="detailPanelClose"><span class="material-icons-round">close</span></button>
        </div>
        <div class="detail-panel-content"><div class="markdown-content" id="detailPanelContent"></div></div>
    </div>

    <script>
        const API_BASE = 'https://api.hzyweb.xyz'; // 必须确保 Node 后端跑在此端口
        const state = { mainNodes: [], progressNodes: {}, isProcessing: false, configPanelVisible: true };
        const elements = {
            taskInput: document.getElementById('taskInput'), fileUpload: document.getElementById('fileUpload'),
            colorPicker: document.getElementById('colorPicker'), decomposeBtn: document.getElementById('decomposeBtn'),
            clearTaskBtn: document.getElementById('clearTaskBtn'), configPanel: document.getElementById('configPanel'),
            configToggleBtn: document.getElementById('configToggleBtn'), configCloseBtn: document.getElementById('configCloseBtn'),
            treeRoot: document.getElementById('treeRoot'), usageGuide: document.getElementById('usageGuide'),
            guideCloseBtn: document.getElementById('guideCloseBtn'), detailPanel: document.getElementById('detailPanel'),
            detailPanelTitle: document.getElementById('detailPanelTitle'), detailPanelContent: document.getElementById('detailPanelContent'),
            detailPanelClose: document.getElementById('detailPanelClose'), exportBtn: document.getElementById('exportBtn'),
            clearAllBtn: document.getElementById('clearAllBtn')
        };

        // 事件绑定
        elements.configToggleBtn.addEventListener('click', toggleConfigPanel);
        elements.configCloseBtn.addEventListener('click', toggleConfigPanel);
        elements.colorPicker.addEventListener('click', handleColorChange);
        elements.decomposeBtn.addEventListener('click', handleDecompose);
        elements.clearTaskBtn.addEventListener('click', () => { elements.taskInput.value = ''; elements.fileUpload.value = ''; });
        elements.guideCloseBtn.addEventListener('click', () => elements.usageGuide.classList.add('hidden'));
        elements.detailPanelClose.addEventListener('click', () => elements.detailPanel.classList.remove('visible'));
        elements.exportBtn.addEventListener('click', exportTree);
        elements.clearAllBtn.addEventListener('click', clearAll);

        function toggleConfigPanel() { state.configPanelVisible = !state.configPanelVisible; elements.configPanel.classList.toggle('visible', state.configPanelVisible); }
        function handleColorChange(e) {
            const option = e.target.closest('.color-option'); if (!option) return;
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active')); option.classList.add('active');
            const color = option.dataset.color;
            document.documentElement.style.setProperty('--md-sys-color-primary', color);
            document.documentElement.style.setProperty('--md-sys-color-primary-container', color + '40');
        }

        let hitokotoInterval, hitokotoTimeout;
        function startWindowsLoading() {
            elements.treeRoot.innerHTML = `<div class="win-install-screen" id="winInstallScreen"><div class="win-sentence-container" id="winSentence">正在调度 GLM-4.6V 思考...</div><div class="win-install-footer"><span class="material-icons-round" style="animation: spin 2s linear infinite;">sync</span><span>AI生成中...</span></div></div>`;
            const sentenceEl = document.getElementById('winSentence');
            setTimeout(() => { if (sentenceEl) sentenceEl.classList.add('visible'); }, 100);
            const fetchAndShow = async () => {
                if (!document.getElementById('winSentence')) return;
                sentenceEl.classList.remove('visible');
                hitokotoTimeout = setTimeout(async () => {
                    if (!document.getElementById('winSentence')) return;
                    try {
                        const res = await fetch('https://v1.hitokoto.cn/?c=i&encode=json');
                        sentenceEl.innerText = (await res.json()).hitokoto;
                    } catch (e) { sentenceEl.innerText = '保持热爱，奔赴山海。'; }
                    sentenceEl.classList.add('visible');
                }, 1000); 
            };
            hitokotoInterval = setInterval(fetchAndShow, 5000);
        }

        function stopWindowsLoading(cb) {
            clearInterval(hitokotoInterval); clearTimeout(hitokotoTimeout);
            const screen = document.getElementById('winInstallScreen');
            if (screen) { screen.classList.add('fade-out'); setTimeout(() => cb && cb(), 800); } else { cb && cb(); }
        }

        // 统一 SSE 流式请求工具
        async function fetchSSE(url, bodyData, streamCallback) {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyData) });
            if (!response.ok) throw new Error(`请求后端失败: ${response.status}`);
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '', buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let lines = buffer.split('\n');
                buffer = lines.pop();
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const content = JSON.parse(line.slice(6)).choices?.[0]?.delta?.content || "";
                            if (content) { fullText += content; if(streamCallback) streamCallback(fullText, false); }
                        } catch (e) {}
                    }
                }
            }
            if(streamCallback) streamCallback(fullText, true);
            return fullText;
        }

        async function extractFilesContent() {
            let textContent = "", imageList = []; 
            for (const file of elements.fileUpload.files) {
                if (file.type.startsWith('image/')) {
                    imageList.push(await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); }));
                } else if (file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                    textContent += `\n\n【附件参考：${file.name}】\n${await file.text()}\n`;
                }
            }
            return { textContent, imageList };
        }

        async function handleDecompose() {
            if (state.isProcessing) return;
            if (!elements.taskInput.value.trim()) return alert('请输入任务描述');
            
            toggleConfigPanel(); state.isProcessing = true; elements.decomposeBtn.disabled = true;
            startWindowsLoading();

            try {
                const { textContent, imageList } = await extractFilesContent();
                const payload = { taskText: `请分解任务：\n${elements.taskInput.value.trim()}${textContent}`, images: imageList };

                await fetchSSE(`${API_BASE}/api/decompose`, payload, (streamText, isComplete) => {
                    if (isComplete) {
                        try {
                            const cleanJson = streamText.replace(/```json/gi, '').replace(/```/g, '').trim();
                            state.mainNodes = JSON.parse(cleanJson); state.progressNodes = {};
                            stopWindowsLoading(() => renderTree());
                        } catch (e) {
                            stopWindowsLoading(() => { alert(`解析失败。`); elements.treeRoot.innerHTML = `<div class="empty-state"><p>JSON解析失败</p></div>`; });
                        }
                    }
                });
            } catch (err) {
                stopWindowsLoading(() => { alert('处理出错：' + err.message); elements.treeRoot.innerHTML = `<div class="empty-state"><p>后端连接失败</p></div>`; });
            } finally { elements.decomposeBtn.disabled = false; state.isProcessing = false; }
        }

        function renderTree() {
            elements.treeRoot.innerHTML = '';
            if (!state.mainNodes.length) { elements.treeRoot.innerHTML = `<div class="empty-state"><p>暂无数据</p></div>`; return; }

            const nodeMap = {}, roots = [];
            state.mainNodes.forEach(n => { n.children = []; nodeMap[n.id] = n; });
            state.mainNodes.forEach(n => { if (n.parentId && nodeMap[n.parentId]) nodeMap[n.parentId].children.push(n); else roots.push(n); });

            function buildHtml(node) {
                const pList = state.progressNodes[node.id] || [];
                let pHTML = pList.length ? `<div class="progress-container">${pList.map((p, i) => `<div class="progress-node" onclick="showDetail('${node.id}', ${i})"><div class="progress-header">进度 #${i+1}</div><div class="progress-preview" id="prev-${node.id}-${i}">${p.content.substring(0,50)}...</div></div>`).join('')}</div>` : '';
                
                let html = `<li><div class="node-container"><div class="node-bubble" id="node-${node.id}"><div class="node-header"><div class="node-number">${state.mainNodes.indexOf(node)+1}</div><div class="node-title">${node.title}</div></div><div class="node-desc">${node.desc}</div><div class="node-action"><button class="md-button md-button-primary" onclick="askNode('${node.id}')">提问</button></div></div>${pHTML}</div>`;
                if (node.children.length) html += `<ul>${node.children.map(buildHtml).join('')}</ul>`;
                return html + '</li>';
            }
            elements.treeRoot.innerHTML = `<ul>${roots.map(buildHtml).join('')}</ul>`;
        }

        async function askNode(nodeId) {
            const node = state.mainNodes.find(n => n.id == nodeId);
            const userQuestion = prompt(`关于步骤 [${node.title}] 您的疑问是？\n留空默认索要执行方案：`);
            if (userQuestion === null) return;

            const btn = document.querySelector(`#node-${nodeId} button`);
            const origTxt = btn.innerText; btn.disabled = true; btn.innerText = '请求中...';

            try {
                if (!state.progressNodes[nodeId]) state.progressNodes[nodeId] = [];
                const pIdx = state.progressNodes[nodeId].length;
                state.progressNodes[nodeId].push({ content: '' }); renderTree();
                const prevEl = document.getElementById(`prev-${nodeId}-${pIdx}`);
                if (prevEl) prevEl.innerText = '生成中...';

                await fetchSSE(`${API_BASE}/api/ask`, { nodeId: node.id, title: node.title, desc: node.desc, userQuestion }, (streamText) => {
                    state.progressNodes[nodeId][pIdx].content = streamText;
                    if (prevEl) prevEl.innerText = streamText.substring(0,50) + '...';
                    if (elements.detailPanel.classList.contains('visible') && elements.detailPanelTitle.innerText.includes(`#${pIdx+1}`)) {
                        elements.detailPanelContent.innerHTML = marked.parse(streamText);
                    }
                });
            } catch (err) { alert('通信失败: ' + err.message); } 
            finally { btn.disabled = false; btn.innerText = origTxt; }
        }

        function showDetail(nid, idx) {
            elements.detailPanelTitle.innerText = `${state.mainNodes.find(n=>n.id==nid).title} - 进度 #${idx+1}`;
            elements.detailPanelContent.innerHTML = marked.parse(state.progressNodes[nid][idx].content);
            elements.detailPanel.classList.add('visible');
        }

        function exportTree() {
            if (!state.mainNodes.length) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
            a.download = `tree_${Date.now()}.json`; a.click();
        }
        function clearAll() { if (confirm('确认清空？')) { state.mainNodes = []; state.progressNodes = {}; renderTree(); } }
    </script>
</body>
</html>
